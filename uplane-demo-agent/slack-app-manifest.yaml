# Demo Agent — Slack app manifest.
#
# Its OWN app (spec §2): posts as itself, tokens revocable without touching the
# Ad-Bot or the Digest, and it is structurally DM-only — the only event it can
# receive is a message in its own DM, and nothing in the code can join a channel.
#
# Create it (I can't — app creation needs your account):
#   1. https://api.slack.com/apps → Create New App → **From an app manifest**
#   2. Pick the Uplane workspace, paste this YAML (from `display_information:` down), Create.
#   3. Basic Information → App-Level Tokens → Generate Token and Scopes,
#      name "socket", scope `connections:write` → xapp-… → SLACK_APP_TOKEN in helper/.env
#   4. Install App → Install to Workspace → Bot User OAuth Token xoxb-… → SLACK_BOT_TOKEN
#   5. (optional, for stage-0 intake sweeps) OAuth & Permissions → User OAuth Token
#      xoxp-… → SLACK_USER_TOKEN  (search:read is user-token-only in Slack's API)
#   6. DM it "hi" once ./run.sh --bot is running.
display_information:
  name: Demo Agent
  description: Runs the client-demo pipeline stage by stage, on your sign-off.
  background_color: "#1d2d24"
  long_description: >-
    A stage-gated coworker for client demos: install → assets → research → strategy →
    static prompts. Every stage ends in a fixed-template deliverable in this DM and in
    the client's folder, and nothing advances without your typed sign-off (approve /
    revise / reject). DM-only by construction.
features:
  bot_user:
    display_name: Demo Agent
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    # search:read is the digest's proven read-only intake pattern: filter-only
    # search on YOUR token, seeing only what you already see. Used by stage 0.
    user:
      - search:read
    bot:
      - chat:write        # replies + deliverable summaries in its own DM
      - im:history        # read your messages in ITS OWN DM only
      - im:write          # open that DM
      - files:write       # upload deliverable files/cards
settings:
  event_subscriptions:
    bot_events:
      - message.im        # the ONLY event — it cannot be pulled into a channel
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
